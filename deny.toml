[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    # foldhash, reached transitively through hashbrown. Permissive, OSI-approved.
    # Arrives with mecmcp-transport via metrics-exporter-prometheus -> metrics-util
    # -> hashbrown. mecmcp and rustjunosmcp already allow it; this closes the drift
    # rather than introducing a new exception.
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Shared auth core, consumed by tag. First-party, same org as this repo.
allow-git = ["https://github.com/fastrevmd-lab/mecmcp"]
